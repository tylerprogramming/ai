# n8n + external task runners (JavaScript and Python with extra packages).
# Copy .env.example to .env and set N8N_RUNNERS_AUTH_TOKEN before `docker compose up`.
services:
  n8n:
    # The runners image must be the same version as n8n
    image: n8nio/n8n:${N8N_VERSION:-2.44.4}
    ports:
      # Editor/UI only on this machine. The runner broker (5101) stays on the internal
      # Docker network: the runner container reaches it as http://n8n:5101.
      - "127.0.0.1:5678:5678"
    environment:
      N8N_RUNNERS_MODE: "external"
      N8N_RUNNERS_DISABLED_MODES: "embedded"
      N8N_RUNNERS_JAVASCRIPT_ENABLED: "true"
      N8N_RUNNERS_PYTHON_ENABLED: "true"
      # Shared secret between n8n and the runner; never commit the real value
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN:?Set N8N_RUNNERS_AUTH_TOKEN in .env}"
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
      N8N_RUNNERS_BROKER_PORT: "5101"
      N8N_RESTRICT_FILE_ACCESS_TO: "/videos"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../videos:/videos
    extra_hosts:
      - "host.docker.internal:host-gateway"

  runner:
    image: custom-n8n-runner
    build:
      context: .
      dockerfile: Dockerfile
      args:
        N8N_VERSION: ${N8N_VERSION:-2.44.4}
    environment:
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN:?Set N8N_RUNNERS_AUTH_TOKEN in .env}"
      N8N_RUNNERS_TASK_BROKER_URI: "http://n8n:5101"
      N8N_RUNNERS_LAUNCHER_LOG_LEVEL: "debug"
    volumes:
      - ../videos:/videos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - n8n
    restart: always

volumes:
  n8n_data:
