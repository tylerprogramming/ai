[project]
name = "googledrive"
version = "0.1.0"
description = "googledrive using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15,<2",
    "llama-cloud>=2.18,<3",
    "openai>=2.30,<3",
    "pyairtable>=3.5,<4",
    "pydub",
    "audioop-lts; python_version >= '3.13'",
    "python-dotenv",
]

[project.scripts]
kickoff = "googledrive.main:kickoff"
plot = "googledrive.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
