[project]
name = "day_07"
version = "0.1.0"
description = "day_07 using crewAI"
authors = [{ name = "Tyler Reed", email = "tylerreedytlearning@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,litellm]>=1.15,<2",
    "agentops~=0.4.21",
    "requests>=2.32,<3",
    "python-dotenv>=1.2,<2",
]

# The examples are run as scripts (see README), so Poetry only installs the dependencies.
[tool.poetry]
package-mode = false
