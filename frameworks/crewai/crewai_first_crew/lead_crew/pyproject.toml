[project]
name = "lead_crew"
version = "0.1.0"
description = "Lead Scoring Crew using CrewAI"
authors = [{ name = "You" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai[tools]>=1.15,<2",
  "python-dotenv>=1.2,<2",
]

[project.scripts]
lead_crew = "lead_crew.main:run"
run_crew = "lead_crew.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
