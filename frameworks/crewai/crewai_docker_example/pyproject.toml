[project]
name = "docker"
version = "0.1.0"
description = "docker using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15,<2",
    "python-dotenv>=1.2,<2",
]

[project.scripts]
docker = "docker.main:run"
run_crew = "docker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
